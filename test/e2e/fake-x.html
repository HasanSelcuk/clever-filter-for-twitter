<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home / X</title>
<!-- A small copy of X's timeline markup: the same test ids the extension reads. -->
<style>
  body { margin: 0; background: #000; color: #e7e9ea; font: 15px/20px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { width: 600px; margin: 0 auto; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; min-height: 100vh; }
  .tabs { display: flex; border-bottom: 1px solid #2f3336; height: 53px; }
  .tabs div { flex: 1; display: flex; align-items: center; justify-content: center; color: #71767b; font-weight: 500; }
  .tabs div:first-child { color: #e7e9ea; font-weight: 700; }
  [data-testid="cellInnerDiv"] { position: relative; }
  article { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2f3336; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; }
  .body { flex: 1; min-width: 0; }
  .head { color: #71767b; }
  .head b { color: #e7e9ea; }
  .head a { color: #71767b; text-decoration: none; }
  [data-testid="tweetText"] { margin: 2px 0 10px; white-space: pre-wrap; }
  .quote { border: 1px solid #2f3336; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; }
  .bar { display: flex; justify-content: space-between; max-width: 425px; color: #71767b; font-size: 13px; }
  .bar button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; padding: 0; }
  .bar [data-testid="unlike"] { color: #f91880; }
  .bar [data-testid="removeBookmark"] { color: #1d9bf0; }
  .ad { color: #71767b; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="tabs"><div>For you</div><div>Following</div></div>
  <div aria-label="Timeline: Your Home Timeline"><div id="list"></div></div>
</main>
<script>
  const posts = [
    { id: '1001', name: 'Growth Daily', handle: 'growthdaily', color: '#7856ff',
      text: 'Unlock your potential with these 10 game-changing productivity hacks 🚀\n\n1. Wake up early\n2. Leverage AI\n3. Stay consistent\n\nWhich one resonates with you? 👇' },
    { id: '1002', name: 'Maya', handle: 'mayabakes', color: '#00ba7c',
      text: 'Went to the hardware store and the man at the counter remembered my dog\'s name from two years ago.' },
    { id: '1003', name: 'Deniz', handle: 'denizbuilds', color: '#ff7a00',
      text: 'I rewrote our build in plain make last week. CI went from 9 minutes to 2. The trick was caching the generated headers, not the object files. I measured each step before changing anything.' },
    { id: '1004', name: 'Brand', handle: 'brand', color: '#f4212e', promoted: true,
      text: 'Sponsored: unlock your game-changing growth today.' },
  ];
  for (let i = 0; i < 12; i++) {
    posts.push({ id: String(1010 + i), name: 'Filler ' + i, handle: 'filler' + i, color: '#536471',
      text: 'An ordinary post about lunch, number ' + i + '. Soup again.' });
  }
  posts.push({ id: '1099', name: 'Far Below', handle: 'farbelow', color: '#1d9bf0',
    text: 'I rewrote the parser by hand and measured a 3x speedup on large files.' });

  window.likeClicks = {};
  const list = document.getElementById('list');
  for (const p of posts) {
    const cell = document.createElement('div');
    cell.setAttribute('data-testid', 'cellInnerDiv');
    cell.innerHTML = `
      <div><article data-testid="tweet" tabindex="0">
        <div class="avatar" style="background:${p.color}"></div>
        <div class="body">
          <div class="head" data-testid="User-Name"><b>${p.name}</b> @${p.handle} ·
            ${p.promoted ? '' : `<a href="/${p.handle}/status/${p.id}"><time datetime="2026-10-05T08:00:00Z">2h</time></a>`}
          </div>
          <div data-testid="tweetText" lang="en"></div>
          <div class="bar" role="group">
            <button data-testid="reply">Reply</button>
            <button data-testid="retweet">Repost</button>
            <button data-testid="like">Like</button>
            <button data-testid="bookmark">Bookmark</button>
          </div>
          ${p.promoted ? '<div data-testid="placementTracking" class="ad">Ad</div>' : ''}
        </div>
      </article></div>`;
    cell.querySelector('[data-testid="tweetText"]').textContent = p.text;
    for (const b of cell.querySelectorAll('.bar button')) {
      b.addEventListener('click', () => {
        const id = b.dataset.testid;
        if (id === 'like' || id === 'unlike') {
          window.likeClicks[p.id] = (window.likeClicks[p.id] || 0) + 1;
          b.dataset.testid = id === 'like' ? 'unlike' : 'like';
        }
        if (id === 'bookmark' || id === 'removeBookmark') {
          b.dataset.testid = id === 'bookmark' ? 'removeBookmark' : 'bookmark';
        }
      });
    }
    list.append(cell);
  }
  // X fills the timeline after load; mimic that delay.
  list.style.visibility = 'hidden';
  setTimeout(() => (list.style.visibility = ''), 50);
</script>
</body>
</html>
